[package]
name = "wist-field-api"
version = "0.7.3" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
authors = ["wist Dev Team"]
description = "计算区运维台的 BFF：聚合证据 / 资产 / 采集量 / 设备状态，浏览器只跟它说话"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
env_logger = "0.11"
log = "0.4"
# 到证据服务的客户端：只做转发，不缓存正文。`query` 给运行指标拼 PromQL 参数用。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
toml = "1.1"
# 访问凭据：本服务是 `wist-cred` 的验证方（X）。
# 与 wist-center 同一套接入：摘要表只存 sha256，收数走 mTLS。
# 0.4 起有自注册（`[init]` / `/__init`）与 `serve_when_ready`（材料落盘即起监听）。
# 0.5 起提供登录端点（`login_router` / `Peer::login`）。
wist-cred-peer = "0.5"
# 只有一处用到：把「摘要表读不了」和「令牌不对」分开（错误码是稳定契约）。
wist-auth = { version = "0.3", features = ["credential"] }
# 运行指标页读的是 agent 自观测指标：名字 / label 键 / 单位换算只从这张常量表取。
# 读侧手写名字曾经让整页静默空白（见该 crate 的 names 模块说明）。
wist-metrics = "0.13"
# 凭据 listener 的 mTLS 握手（与 wist-cred-peer / wist-gwlinkd 同一份实现）。
wist-pki = "0.1.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
hex = "0.4"
# 配置里的 `${SEC_...}`：与其它服务同口径（env 优先，其次 `.galaxy/sec_value.yml`）。
orion-sec = "0.7"
orion-variate = "0.14"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# 测试里要造一套真的 mTLS 材料（CA 签的服务器证书 + 私钥），
# 不然「材料齐备 → 启动即就绪」这条路径测不到。
rcgen = { version = "0.13", features = ["pem"] }
