# wist-field-api 示例配置（本地联调口径）
#
# 生产由 `wist-field-stack` 渲染；密钥只放 `${SEC_...}`，不写在这里。

[server]
listen_addr = "127.0.0.1:19200"

[auth]
# cred（默认）：`Authorization: Bearer wcr_…`，摘要由 `wist-cred` 通过 mTLS 推过来
#                    （见下面的 `[credentials]`）。
# ingress：交给入口（VPN / 堡垒机 / 反代）认证，再把操作员写在 `x-field-operator` 里。
# **没有「不校验」这一档。**
mode = "cred"
operator_header = "x-field-operator"

[credentials]
# 接入命令落的 `cred.toml`（identity + verify 两段），本服务只认这个文件。
file = "identity/console/cred/cred.toml"
listen_addr = "127.0.0.1:19310"
store_path = "state/credentials.json"
required_roles = ["read"]

# 到证据服务的身份：BFF 持有的**唯一**凭据来源，浏览器不接受这三项传参。
[evidence]
base_url = "http://127.0.0.1:19174"
tenant = "t-001"
scopes = ["evidence:read"]
max_sensitivity = "paths"
timeout_secs = 10

# 资产拓扑（P0 只用于探活；页面本体由 atlas-web 同源嵌在 /atlas/）
# [atlas]
# base_url = "http://127.0.0.1:18080"
# 读接口令牌：atlas 从 0.3.4 起要求 `Authorization: Bearer`（BFF 是唯一会发它的调用方）。
# 值只放密钥文件/环境变量，不写在这里。
# auth_token = "${SEC_ATLAS_API_TOKEN}"

# 「数据面接入」页展示的写端点 + `/api/health` 的接口探活。
# sink_url 是**数据面视角**的地址（BFF 到不了）；探活另配 sink_health_url。
# [integration]
# sink_url = "http://10.0.0.5:18800"
# sink_health_url = "http://evidence:8080/healthz"

# 运行指标：读的是**本栈** VictoriaMetrics（数据面 wparse 把 agent 采集指标镜像进来）。
# 没配 = 「运行指标」页回 503 `metrics_not_configured`（那是「没接入」，不是故障）。
# [metrics]
# BFF 视角（栈内）的查询入口：探活与指标页用。
# base_url = "http://127.0.0.1:18428"
# 数据面视角的写入端点：只用于「接入」页展示 / copy，BFF 自己不去写。
# 不配就不展示运行指标的写入样板（不编造占位地址）。
# write_url = "http://${METRICS_WRITE_HOST}:${VM_HOST_PORT}"

# 业务层：把「主机集合」归到一个命名的逻辑单元（用来算投入产出比）。
#
# 业务单元 **不是** `app`：`app` 表达用途（这台机器上跑什么），业务单元表达归属
# （这台机器的开销算到哪条业务上）。归属关系只存在于这里，**不下沉到数据面** ——
# agentd / wparse 的 label 契约不动，改归属不用重启数据面。
#
# 规则：`id` 必填且唯一；`name` 留空时用 `id`；一台主机**只能属于一个业务**
# （跨业务共用会让投入重复计账，启动时直接报错）；不在任何业务里的主机会在
# 指标页单列为「未归类」。
#
# 主机 id 就是指标里的 `agent` label（形如 `agent-host-a55a338d7723`），
# 可以在指标页的「计算资源层」看到。
#
# [[business.units]]
# id = "billing"
# name = "计费服务"
# agents = ["agent-host-a55a338d7723", "agent-host-cebad366892a"]
